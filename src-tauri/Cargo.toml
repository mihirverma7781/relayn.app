[package]
name = "aster-player"
version = "0.1.0"
description = "A native local media player powered by libVLC"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
rfd = "0.15"
url = "2"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_SystemServices"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"


[features]
custom-protocol = ["tauri/custom-protocol"]
