name: Desktop builds
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'site/**'
      - 'docs/**'
      - '*.md'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - 'site/**'
      - 'docs/**'
      - '*.md'
      - '.gitignore'
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run verify
      - run: npm run runtime:fetch
      - run: node scripts/prepare-macos.mjs
      - run: npm run fixtures
      - run: cargo test --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
      - run: cargo test --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} -- --ignored --nocapture --test-threads=1
      - run: npm run tauri -- build --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: aster-player-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/
