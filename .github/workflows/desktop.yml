name: Desktop builds
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (leave empty for package.json version)'
        required: false
        type: string
  push:
    branches: [main]
    tags:
      - 'v*'
    paths-ignore:
      - 'site/**'
      - 'docs/**'
      - '*.md'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - 'site/**'
      - 'docs/**'
      - '*.md'
      - '.gitignore'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run verify
      - run: npm run runtime:fetch
      - run: node scripts/prepare-macos.mjs
      - run: npm run fixtures
      - run: cargo test --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
      - run: cargo test --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} -- --ignored --nocapture --test-threads=1
      - run: npm run tauri -- build --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: aster-player-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/

  release:
    needs: build
    if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Organize release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.dmg" -o -name "*setup.exe" -o -name "*.msi" \) -exec cp {} release-assets/ \;
          echo "=== Release Assets to Publish ==="
          ls -lh release-assets/
      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            VERSION=$(node -p "require('./package.json').version")
            TAG="v${VERSION}"
          fi

          echo "Publishing release $TAG..."
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists. Updating release assets..."
            gh release upload "$TAG" release-assets/* --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" release-assets/* \
              --title "RelayN Player $TAG" \
              --generate-notes
          fi
